name: social-cron

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: social-cron
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Watch for completed labs (drafts posts for approval)
        env:
          GITHUB_TOKEN: ${{ secrets.LAB_WATCH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/lab-watcher.mjs

      - name: Publish due scheduled posts
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: node scripts/schedule-run.mjs

      - name: Check mentions (drafts replies for approval)
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: node scripts/mentions.mjs

      - name: Send approved replies
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: node scripts/send-replies.mjs

      - name: Write content (drafts original posts for approval)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/research-content.mjs

      - name: Write up homelabs (drafts portfolio posts for approval)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/homelab-watcher.mjs

      # Order matters: read replies before publishing, so approving a post
      # sends it on this same run rather than waiting for the next tick.
      - name: Read approval replies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-approvals.mjs

      - name: Send approved content
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: node scripts/send-content.mjs

      # After sending, so a just-published draft never gets an issue opened
      # for it.
      - name: Ask for approval on new drafts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/request-approval.mjs

      # Last, so the page reflects everything the run just did.
      - name: Rebuild the live status page
        run: node scripts/build-dashboard.mjs

      - name: Commit state changes
        run: |
          git config user.name "social-automation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/ scheduled/ drafts/posted/ pending-replies/ pending-posts/ homelabs/ topics/ index.html
          git diff --cached --quiet || git commit -m "chore: update automation state [skip ci]"
          git push
